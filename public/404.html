<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shululu Lyrics — Redirecting...</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages 404s
      var segmentCount = 1;
      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var redirectUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoBase + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/') +
        (l.search ? '&q=' + l.search.slice(1) : '') + l.hash;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body class="bg-[#121922] text-[#EEF3F8]">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif;">
      <p>Loading Shululu Lyrics...</p>
    </div>
  </body>
</html>
